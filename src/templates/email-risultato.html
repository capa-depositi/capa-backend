<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body style="margin:0;padding:0;background:#f9fafb;font-family:Arial,Helvetica,sans-serif;color:#111827;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f9fafb;padding:24px 12px;">
      <tr>
        <td align="center">
          <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;background:#ffffff;border-radius:12px;overflow:hidden;">
            <tr>
              <td>
                <img src="{{HERO_IMAGE}}" alt="Circo CAPA" width="600" style="display:block;width:100%;max-width:600px;height:auto;border:0;" />
              </td>
            </tr>
            <tr>
              <td style="padding:24px;">
                <h2 style="margin:0 0 16px;font-size:22px;color:#111827;">Ciao {{NOME}}</h2>
                <p style="margin:0 0 20px;font-size:15px;line-height:1.5;color:#111827;">Il tuo risultato è pronto: puoi visualizzarlo cliccando il pulsante qui sotto. Il link sarà valido per {{SCADENZA_GIORNI}} giorni.</p>
                <table role="presentation" cellpadding="0" cellspacing="0">
                  <tr>
                    <td style="background:#111827;border-radius:8px;">
                      <a href="{{LINK_RISULTATO}}" style="display:inline-block;padding:12px 20px;font-size:15px;font-weight:bold;color:#ffffff;text-decoration:none;"><span style="color:#ffffff;">Vedi il risultato</span></a>
                    </td>
                  </tr>
                </table>
                <p style="margin:20px 0 0;font-size:13px;color:#6b7280;">Se non hai richiesto questo link, ignora questa email.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
